<!--
  Test page for a first WebRTC link between a phone and the puck, served by the puck itself.
  It sends its offer to the puck over HTTP (POST /offer) and gets the answer back: ordinary
  signalling, just for this test. Then it sends the time every 100 ms; the puck echoes it,
  and the page shows the round trip.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puck link test</title>
<style>
  body { background: #05070f; color: #e8ebf5; font: 20px system-ui, sans-serif; margin: 16px; }
  button { font-size: 22px; padding: 12px 24px; }
  #stats { font-size: 26px; }
  pre { font-size: 15px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Puck link test</h1>
<button id="go">Connect</button>
<p id="state">Not connected</p>
<p id="stats"></p>
<pre id="log"></pre>
<script>
const $ = (id) => document.getElementById(id);
const log = (text) => { $('log').textContent += `${(performance.now() / 1000).toFixed(2)} s  ${text}\n`; };

// Waits until the browser has found all its addresses, so the offer holds them all
// (the puck doesn't take candidates one by one). Gives up after 3 s.
function gatheringDone(pc) {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') resolve();
    pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && resolve();
    setTimeout(resolve, 3000);
  });
}

$('go').onclick = async () => {
  $('go').disabled = true;
  // No STUN server: the phone and the puck are on the same network.
  const pc = new RTCPeerConnection();
  const channel = pc.createDataChannel('test');
  pc.onconnectionstatechange = () => {
    $('state').textContent = `Connection: ${pc.connectionState}`;
    log(`connection ${pc.connectionState}`);
  };

  await pc.setLocalDescription(await pc.createOffer());
  await gatheringDone(pc);
  log('offer ready, sending to the puck');
  const response = await fetch('/offer', { method: 'POST', body: pc.localDescription.sdp });
  if (!response.ok) { log(`puck refused: ${response.status}`); return; }
  await pc.setRemoteDescription({ type: 'answer', sdp: await response.text() });
  log('answer received');

  const trips = [];
  let replies = 0;
  channel.onopen = () => {
    log('data channel open');
    setInterval(() => channel.readyState === 'open' && channel.send(String(performance.now())), 100);
  };
  channel.onclose = () => log('data channel closed');
  channel.onmessage = (event) => {
    replies++;
    trips.push(performance.now() - Number(event.data));
    if (trips.length > 100) trips.shift();
    const sorted = [...trips].sort((a, b) => a - b);
    const median = sorted[sorted.length >> 1];
    const worst = sorted[sorted.length - 1];
    $('stats').textContent =
      `Round trip: median ${median.toFixed(1)} ms, worst ${worst.toFixed(1)} ms (last 100). Replies: ${replies}`;
  };
};
</script>
</body>
</html>
